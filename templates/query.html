{% extends "base.html" %}

{% block title %}Query — ZipLattice{% endblock %}
{% block nav_query %}text-white border-b border-white{% endblock %}

{% block content %}
<div class="space-y-8 max-w-2xl">
  <h1 class="text-2xl font-bold">Query Knowledge Graph</h1>

  <form hx-post="/query" hx-target="#query-result" hx-swap="innerHTML" class="space-y-6">

    <!-- Graph selection -->
    <div class="space-y-2">
      <label class="block text-sm text-gray-400">Knowledge Graph</label>
      <select name="graph_name" required
              class="w-full bg-black border border-gray-800 px-3 py-2 text-sm focus:outline-none focus:border-white">
        <option value="">— Select a graph —</option>
        {% for g in graphs %}
        <option value="{{ g.name }}">{{ g.name }} ({{ g.nodes }} nodes)</option>
        {% endfor %}
      </select>
    </div>

    <!-- Query text -->
    <div class="space-y-2">
      <label class="block text-sm text-gray-400">Query</label>
      <textarea name="query" rows="3" required placeholder="Enter your question or search query…"
                class="w-full bg-black border border-gray-800 px-3 py-2 text-sm focus:outline-none focus:border-white resize-y"></textarea>
    </div>

    <!-- Query mode -->
    <div class="space-y-2">
      <label class="block text-sm text-gray-400">Mode</label>
      <div class="flex gap-4">
        <label class="flex items-center gap-2 text-sm cursor-pointer">
          <input type="radio" name="mode" value="search" checked class="accent-white"> Search
        </label>
        <label class="flex items-center gap-2 text-sm cursor-pointer">
          <input type="radio" name="mode" value="context" class="accent-white"> Context
        </label>
        <label class="flex items-center gap-2 text-sm cursor-pointer">
          <input type="radio" name="mode" value="ask" class="accent-white"> Ask
        </label>
      </div>
    </div>

    <!-- Model config (collapsible) -->
    <details class="border border-gray-800">
      <summary class="px-3 py-2 text-sm text-gray-400 cursor-pointer hover:text-white">
        Model Configuration
      </summary>
      <div class="px-3 py-3 space-y-3 border-t border-gray-800">
        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="block text-xs text-gray-400">API URL</label>
            <input type="text" name="api_url" value="http://localhost:11434"
                   class="w-full bg-black border border-gray-800 px-2 py-1 text-xs focus:outline-none focus:border-white">
          </div>
          <div class="space-y-1">
            <label class="block text-xs text-gray-400">Query Model (for Ask)</label>
            <input type="text" name="query_model" value="qwen3-coder:30b"
                   class="w-full bg-black border border-gray-800 px-2 py-1 text-xs focus:outline-none focus:border-white">
          </div>
          <div class="space-y-1">
            <label class="block text-xs text-gray-400">Embed URL</label>
            <input type="text" name="embed_url" value=""
                   placeholder="Same as API URL"
                   class="w-full bg-black border border-gray-800 px-2 py-1 text-xs focus:outline-none focus:border-white">
          </div>
          <div class="space-y-1">
            <label class="block text-xs text-gray-400">Embed Model</label>
            <input type="text" name="embed_model" value=""
                   placeholder="From graph or nomic-embed-text"
                   class="w-full bg-black border border-gray-800 px-2 py-1 text-xs focus:outline-none focus:border-white">
          </div>
        </div>
      </div>
    </details>

    <button type="submit"
            class="border border-white px-6 py-2 text-sm hover:bg-white hover:text-black transition-colors">
      Run Query
    </button>
    <span class="htmx-indicator text-sm text-gray-400 ml-3">Querying…</span>
  </form>

  <!-- Query result area -->
  <div id="query-result"></div>
</div>
{% endblock %}
